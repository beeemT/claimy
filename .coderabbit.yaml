# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Be concise and evidence-based. Use clear, simple English. Prioritize correctness,
  security, and maintainability. Avoid speculative findings and style-only noise.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  path_instructions:
    - path: "**"
      instructions: >-
        Use docs/environment-claim-plan.md as the behavior contract and README.md
        for current commands and verification boundaries. Prefer YAGNI and KISS.
        Identify concrete consumer-visible regressions; do not expand product scope
        or describe disposable fixtures as proof of a live deployment.
    - path: "internal/storage/mysql/**"
      instructions: >-
        Preserve permanent group-row locking for every writer, including catalog
        registration, and atomic acquisition across both environments. Conflict
        decisions must use current reads and database UTC operation time. Retry
        only whole transactions after known rollback; never retry an ambiguous
        commit. Saved request results must preserve original facts while successful
        acquisition replay refreshes activeNow. Busy replay must remain busy.
    - path: "internal/**"
      instructions: >-
        Derive ownership from authenticated identities, never request bodies.
        Same-owner overlaps remain separate claims. Any authenticated team member
        may release or change expiry; record the actor without changing owner or
        scope. Preserve revision checks and immutable request-key payload matching.
        Never revive expired claims or classify auth, transport, or storage failure
        as busy. Preserve no-argument server startup and signed Chat deduplication.
    - path: "pkg/client/**"
      instructions: >-
        Use the generated transport and shared wire models. Preserve bounded
        default timeouts and caller overrides, structured errors, cancellation,
        and no implicit mutation retries. Missing success discriminators, missing
        activeNow, or a null response body must not become busy or valid empty data.
        Explicit activeNow:false is a valid inactive replay. Never echo bearer
        tokens or untrusted response bodies in fallback diagnostics.
    - path: "internal/cli/**"
      instructions: >-
        All API requests must use pkg/client. Stable mutation request IDs are
        caller-owned. Acquisition exits 0 only when acquired and active, 1 for busy
        or inactive replay, and 2 for failures. ID output is permitted only for
        active acquisition. Help must work without auth or network access. Tokens
        come from environment or a file, not command-line token arguments.
    - path: "**/*_test.go"
      instructions: >-
        Tests must prove consumer behavior, boundaries, errors, or state transitions.
        Prefer deterministic isolated fixtures. Use disposable MySQL and independent
        connections with barriers for concurrency; never test against shared data.
        Avoid wording, source-text, forwarding, and mock-echo assertions. Preserve
        real signed API, native/container CLI, and database-failure smoke coverage.
    - path: "api/**"
      instructions: >-
        Edit OpenAPI template and YAML fragments, then regenerate api/openapi.yaml
        and pkg/client/client.gen.go with go generate ./.... Preserve the public
        wire contract and generated-drift checks. Keep public examples neutral and
        free of credentials or private hosts.
    - path: "**/*.gen.go"
      instructions: >-
        Do not propose hand edits to generated files. Direct fixes to their
        authoritative generator inputs and require regenerated output.
    - path: "**/mocks/**"
      instructions: >-
        These files are generated by Mockery. Fix interfaces or generator inputs,
        then regenerate; do not propose hand edits to mocks.
