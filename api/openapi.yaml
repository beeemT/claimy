openapi: 3.0.3
info:
  title: Claimy API
  version: 1.0.0
  description: Authenticated environment-claim and read-only catalog API.
security:
  - BearerAuth: []
paths:
  /v1/auth/config:
    get:
      operationId: GetLoginConfig
      security: []
      responses:
        '200':
          description: Public browser-login configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginConfig'
        '404': {$ref: '#/components/responses/LoginDisabled'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/auth/me:
    get:
      operationId: GetLoginIdentity
      responses:
        '200':
          description: Authenticated manual REST identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginIdentity'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/claims/acquire:
    post:
      operationId: acquireClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireRequest'
      responses:
        '200':
          description: Acquired claim or a busy result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/ConflictResponse'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/claims/query:
    post:
      operationId: queryClaims
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Current, retained historical, or projected claim query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/HistoryUnavailable'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/claims/{id}/release:
    post:
      operationId: releaseClaim
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
      responses:
        '200':
          description: Claim released or already inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConflictResponse'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/claims/{id}:
    patch:
      operationId: changeClaimExpiry
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpiryRequest'
      responses:
        '200':
          description: Expiry changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConflictResponse'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/catalog/groups/query:
    post:
      operationId: listCatalogGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogListRequest'
      responses:
        '200':
          description: Registered application groups, independent of claim rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogGroupsResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/catalog/groups/{groupSlug}:
    get:
      operationId: getCatalogGroup
      parameters:
        - in: path
          name: groupSlug
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Registered application group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogGroup'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/catalog/groups/{groupSlug}/apps/query:
    post:
      operationId: listCatalogApps
      parameters:
        - in: path
          name: groupSlug
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogListRequest'
      responses:
        '200':
          description: Registered apps in the selected group, independent of claim rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAppsResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request, filter, scope, time, or pagination.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Authenticated identity is outside the configured team.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Claim or catalog identity does not exist.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    LoginDisabled:
      description: Browser login is disabled.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ConflictResponse:
      description: Revision conflict or request ID reused with another payload.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    HistoryUnavailable:
      description: Requested history predates the retention window.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServerError:
      description: Storage or unexpected service failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    LoginConfig:
      type: object
      additionalProperties: false
      required: [issuer, clientId, scopes]
      properties:
        issuer: {type: string, format: uri, minLength: 1, maxLength: 2048}
        clientId: {type: string, minLength: 1, maxLength: 1024}
        scopes:
          type: array
          minItems: 2
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        authorizationParams:
          type: object
          additionalProperties:
            type: string
            maxLength: 128
    LoginIdentity:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, minLength: 3, maxLength: 320}
    Environment:
      type: string
      enum: [sandbox, prod]
    Source:
      type: string
      enum: [manual, ci]
    Scope:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group: {type: string, minLength: 1, maxLength: 128}
        app: {type: string, minLength: 1, maxLength: 128}
    GitLabIdentity:
      type: object
      additionalProperties: false
      required: [issuer, projectId, jobId, userId]
      properties:
        issuer: {type: string, minLength: 1, maxLength: 255}
        projectId: {type: string, minLength: 1, maxLength: 128}
        jobId: {type: string, minLength: 1, maxLength: 128}
        userId: {type: string, minLength: 1, maxLength: 128}
    Claim:
      type: object
      additionalProperties: false
      required: [id, scope, environments, ownerEmail, source, createdAt, expiresAt, revision, activeNow, inherited]
      properties:
        id: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/Scope'}
        environments:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Environment'}
        ownerEmail: {type: string, format: email, minLength: 3, maxLength: 320}
        source: {$ref: '#/components/schemas/Source'}
        gitlab: {$ref: '#/components/schemas/GitLabIdentity'}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        releasedAt: {type: string, format: date-time}
        revision: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
        activeNow: {type: boolean}
        inherited: {type: boolean}
    Conflict:
      type: object
      additionalProperties: false
      required: [id, scope, environments, ownerEmail, source, expiresAt]
      properties:
        id: {type: string, format: uuid}
        scope: {$ref: '#/components/schemas/Scope'}
        environments:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Environment'}
        ownerEmail: {type: string, format: email, minLength: 3, maxLength: 320}
        source: {$ref: '#/components/schemas/Source'}
        expiresAt: {type: string, format: date-time}
    AcquireRequest:
      type: object
      additionalProperties: false
      required: [group, environments, requestId]
      properties:
        group: {type: string, minLength: 1, maxLength: 128}
        app: {type: string, minLength: 1, maxLength: 128}
        environments:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Environment'}
        expiresAt: {type: string, format: date-time}
        requestId: {type: string, minLength: 1, maxLength: 128}
    AcquireResponse:
      type: object
      additionalProperties: false
      required: [acquired]
      properties:
        acquired: {type: boolean}
        claim: {$ref: '#/components/schemas/Claim'}
        conflicts:
          type: array
          items: {$ref: '#/components/schemas/Conflict'}
    QueryRequest:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group: {type: string, minLength: 1, maxLength: 128}
        app: {type: string, minLength: 1, maxLength: 128}
        environments:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Environment'}
        at: {type: string, format: date-time}
    QueryResponse:
      type: object
      additionalProperties: false
      required: [known, at, projected, free, allowedForCaller, claims]
      properties:
        known: {type: boolean}
        at: {type: string, format: date-time}
        projected: {type: boolean}
        free: {type: boolean}
        allowedForCaller: {type: boolean}
        claims:
          type: array
          items: {$ref: '#/components/schemas/Claim'}
    MutationRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: {type: string, minLength: 1, maxLength: 128}
    ExpiryRequest:
      type: object
      additionalProperties: false
      required: [expiresAt, expectedRevision, requestId]
      properties:
        expiresAt: {type: string, format: date-time}
        expectedRevision: {type: integer, format: int64, minimum: 1, maximum: 4294967295}
        requestId: {type: string, minLength: 1, maxLength: 128}
    MutationResponse:
      type: object
      additionalProperties: false
      required: [changed, claim]
      properties:
        changed: {type: boolean}
        claim: {$ref: '#/components/schemas/Claim'}
    CatalogFilter:
      type: object
      additionalProperties: false
      properties:
        canonicalName:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    CatalogPage:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, format: int32, minimum: 0, maximum: 100}
        offset: {type: integer, format: int32, minimum: 0}
    CatalogListRequest:
      type: object
      additionalProperties: false
      properties:
        filter: {$ref: '#/components/schemas/CatalogFilter'}
        page: {$ref: '#/components/schemas/CatalogPage'}
    CatalogGroup:
      type: object
      additionalProperties: false
      required: [id, canonicalName, createdAt]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        canonicalName: {type: string, minLength: 1, maxLength: 128}
        createdAt: {type: string, format: date-time}
    CatalogApp:
      type: object
      additionalProperties: false
      required: [id, groupId, canonicalName, createdAt]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        groupId: {type: string, pattern: '^[0-9]+$'}
        canonicalName: {type: string, minLength: 1, maxLength: 128}
        createdAt: {type: string, format: date-time}
    CatalogGroupsResponse:
      type: object
      additionalProperties: false
      required: [results, total]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/CatalogGroup'}
        total: {type: integer, format: int64, minimum: 0}
    CatalogAppsResponse:
      type: object
      additionalProperties: false
      required: [results, total]
      properties:
        results:
          type: array
          items: {$ref: '#/components/schemas/CatalogApp'}
        total: {type: integer, format: int64, minimum: 0}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, status]
      properties:
        code:
          type: string
          enum: [invalid_request, unauthenticated, forbidden, not_found, history_unavailable, conflict, storage_error, login_disabled]
        message: {type: string}
        status: {type: integer, format: int32, minimum: 400, maximum: 599}
