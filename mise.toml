[tools]
go = "1.27.0"
gofumpt = "0.7.0"
golangci-lint = "2.13.1"
prek = "0.4.11"
gitleaks = "8.30.1"
mockery = "3.7.0"
oapi-codegen = "2.4.1"
"go:github.com/justtrackio/gotempl" = "1.0.1"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.24.3"
helm = "4.2.3"
kind = "0.33.0"
kubectl = "1.36.1"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "1.7.12"

[tasks.setup]
description = "Download Go dependencies and install git hooks"
run = "go mod download && prek install"

[tasks.worktree-setup]
description = "Set up a worktree with Go dependencies and git hooks"
depends = ["setup"]

[tasks.version-check]
description = "Check that go.mod and mise.toml pin the same Go version"
run = "sh scripts/check-go-version.sh"

[tasks.fmt]
description = "Format Go source with gofumpt"
run = "gofumpt -w ."

[tasks.fmt-check]
description = "Fail when Go source is not gofumpt-formatted"
run = "sh scripts/check-gofumpt.sh"

[tasks.vet]
description = "Run go vet across all packages"
run = "go vet ./..."

[tasks.lint]
description = "Run the pinned golangci-lint configuration"
run = "golangci-lint run"

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.test-integration]
description = "Run isolated MySQL and signed-identity acceptance tests"
run = "go test -tags=integration,fixtures ./..."

[tasks.generate]
description = "Generate rendered OpenAPI spec, public client, and interface mocks"
run = "go generate ./..."

[tasks.generate-check]
description = "Regenerate and reject tracked or untracked generated-file drift"
run = "sh scripts/check-generated.sh"


[tasks.helm-check]
description = "Lint, render, and package the Helm chart with safe synthetic values"
run = "sh scripts/check-helm.sh"

[tasks.helm-package]
description = "Package the Helm chart for release artifacts"
usage = 'arg "[version]" default="0.0.0" help="Stable release version or local snapshot"'
run = 'sh scripts/package-helm.sh "${usage_version?}"'

[tasks.helm-smoke]
description = "Install and exercise the Helm chart in a private disposable kind cluster"
run = ': "${CLAIMY_IMAGE:?Set CLAIMY_IMAGE to a pre-built local image}"; CLAIMY_HELM_SMOKE=1 go test -count=1 -tags=integration,fixtures ./test/e2e -run "^TestHelmChartIntegration$"'

[tasks.migrate-validate]
description = "Validate timestamped Goose migrations without connecting to a database"
run = "goose -dir build/migrations/claimy validate"

[tasks.migrate]
description = "Apply Goose migrations to an explicitly selected Claimy database"
run = '''
: "${GOOSE_DBSTRING:?Set GOOSE_DBSTRING for a dedicated Claimy database}"
GOOSE_DRIVER=mysql goose -dir build/migrations/claimy up
'''

[tasks.build]
description = "Build the Claimy executable"
run = "mkdir -p build/bin && go build -o build/bin/claimy ./cmd/claimy"

[tasks.package]
description = "Build four native Homebrew release archives"
usage = 'arg "[version]" default="0.0.0" help="Stable release version or local snapshot"'
run = 'sh scripts/build-archives.sh "${usage_version?}"'

[tasks.formula]
description = "Generate checksums and a Homebrew formula from dist archives"
usage = 'arg "[version]" default="0.0.0" help="Version of the archives in dist"'
run = 'python3 scripts/generate-formula.py "${usage_version?}"'

[tasks.package-local]
description = "Build local archives, Helm chart, and generate the Homebrew formula"
usage = 'arg "[version]" default="0.0.0" help="Stable release version or local snapshot"'
run = 'mise run package "${usage_version?}" && mise run helm-package "${usage_version?}" && mise run formula "${usage_version?}"'

[tasks.run]
description = "Run Claimy using the safe root distribution configuration"
run = "go run ./cmd/claimy serve"

[tasks.secret-scan]
description = "Scan available Git history and working files with redacted Gitleaks output"
run = '''gitleaks git --redact --no-banner --log-opts="--all" && gitleaks dir --redact --no-banner .'''

[tasks.ci-lint]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks.check]
description = "Run all local and CI checks"
run = "mise run version-check && mise run ci-lint && mise run fmt-check && mise run helm-check && mise run vet && mise run lint && mise run test && mise run test-integration && mise run generate-check && mise run migrate-validate && mise run secret-scan && mise run build"
