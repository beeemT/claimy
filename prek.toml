# Configuration for `prek`, a git hook framework.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "check-toml" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "fmt-check", name = "gofumpt formatting", entry = "mise run fmt-check", language = "system", files = "\\.go$", pass_filenames = false },
  { id = "golangci-lint", name = "golangci-lint", entry = "mise run lint", language = "system", files = "\\.go$", pass_filenames = false },
]
