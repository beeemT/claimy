    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #273b32;
        background: #f7f8f1;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 42%, rgba(226, 240, 225, 0.76) 0, rgba(226, 240, 225, 0) 38rem),
          #f7f8f1;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: clamp(28px, 6vh, 64px) 24px;
      }

      .welcome {
        width: min(100%, 560px);
        text-align: center;
      }

      .mascot {
        position: relative;
        display: grid;
        width: clamp(164px, 23vw, 198px);
        aspect-ratio: 1;
        place-items: center;
        margin: 0 auto 23px;
        overflow: hidden;
        border: 1px solid rgba(103, 145, 116, 0.13);
        border-radius: 49% 51% 47% 53% / 52% 48% 52% 48%;
        background:
          radial-gradient(circle at 35% 27%, rgba(255, 255, 255, 0.88), transparent 39%),
          #e5f0e3;
        box-shadow: 0 17px 35px rgba(64, 99, 74, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .mascot::before,
      .mascot::after {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #aacbae;
        content: "";
      }

      .mascot::before {
        top: 31px;
        right: 31px;
      }

      .mascot::after {
        bottom: 37px;
        left: 25px;
        width: 5px;
        height: 5px;
        background: #d2bda6;
      }

      .mascot-art {
        display: block;
        width: 83%;
        height: 83%;
        object-fit: contain;
        animation: mascot-settle 4.4s ease-in-out 1;
      }

      @keyframes mascot-settle {
        0%,
        100% {
          transform: none;
        }

        40% {
          transform: translateY(-2px) rotate(-1deg);
        }

        70% {
          transform: translateY(1px) rotate(1deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mascot-art {
          animation: none;
        }
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 17px;
        padding: 8px 13px;
        border: 1px solid #d5e6d5;
        border-radius: 999px;
        background: #edf5eb;
        color: #356344;
        font-size: 0.78rem;
        font-weight: 650;
        line-height: 1;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 50%;
        background: #639572;
      }

      h1 {
        margin: 0;
        color: #283b32;
        font-size: clamp(2rem, 7vw, 3.4rem);
        font-weight: 680;
        letter-spacing: -0.055em;
        line-height: 1.04;
      }

      .message {
        margin: 15px 0 29px;
        color: #65756b;
        font-size: clamp(1rem, 2.5vw, 1.1rem);
        line-height: 1.6;
      }

      .terminal-note {
        display: flex;
        align-items: center;
        gap: 13px;
        width: min(100%, 420px);
        margin: 0 auto;
        padding: 15px 18px;
        border: 1px solid #e5e9df;
        border-radius: 18px;
        background: rgba(255, 255, 252, 0.78);
        color: #56685c;
        text-align: left;
      }

      .terminal-mark {
        display: grid;
        width: 35px;
        height: 35px;
        flex: 0 0 35px;
        place-items: center;
        border-radius: 12px;
        background: #eff4e9;
        color: #52745a;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .terminal-copy {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .terminal-copy strong {
        display: block;
        margin-bottom: 1px;
        color: #354b3d;
        font-size: 0.9rem;
        font-weight: 650;
      }

      @media (max-width: 480px) {
        main {
          padding: 30px 20px;
        }

        .message {
          margin-bottom: 25px;
        }

        .terminal-note {
          padding: 14px 15px;
        }
      }

    </style>
  </head>
  <body>
    <main>
