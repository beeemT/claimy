    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #273b32;
        background: #f7f8f1;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 39%, rgba(242, 226, 220, 0.76) 0, rgba(242, 226, 220, 0) 38rem),
          #f7f8f1;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: clamp(40px, 8vh, 78px) 24px;
      }

      .welcome {
        width: min(100%, 560px);
        text-align: center;
      }

      .mascot {
        position: relative;
        display: grid;
        width: clamp(164px, 23vw, 198px);
        aspect-ratio: 1;
        place-items: center;
        margin: 0 auto 23px;
        overflow: hidden;
        border: 1px solid rgba(163, 116, 99, 0.15);
        border-radius: 49% 51% 47% 53% / 52% 48% 52% 48%;
        background:
          radial-gradient(circle at 35% 27%, rgba(255, 255, 255, 0.88), transparent 39%),
          #f2e5df;
        box-shadow: 0 17px 35px rgba(111, 79, 68, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .mascot::before,
      .mascot::after {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d9b7a9;
        content: "";
      }

      .mascot::before {
        top: 31px;
        left: 31px;
      }

      .mascot::after {
        bottom: 37px;
        left: 25px;
        width: 5px;
        height: 5px;
        background: #d2bda6;
      }

      .mascot-art {
        display: block;
        width: 83%;
        height: 83%;
        object-fit: contain;
        animation: mascot-settle 4.2s ease-in-out 1;
      }

      @keyframes mascot-settle {
        0%,
        100% {
          transform: none;
        }

        40% {
          transform: translateY(-2px) rotate(-1deg);
        }

        70% {
          transform: translateY(1px) rotate(1deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mascot-art {
          animation: none;
        }
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 17px;
        padding: 8px 13px;
        border: 1px solid #ead5cc;
        border-radius: 999px;
        background: #f8ece7;
        color: #795447;
        font-size: 0.78rem;
        font-weight: 650;
        line-height: 1;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 50%;
        background: #b47e5e;
      }

      h1 {
        margin: 0;
        color: #283b32;
        font-size: clamp(2.35rem, 7vw, 3.4rem);
        font-weight: 680;
        letter-spacing: -0.055em;
        line-height: 1.04;
      }

      .message {
        margin: 15px 0 29px;
        color: #746d69;
        font-size: clamp(1rem, 2.5vw, 1.1rem);
        line-height: 1.6;
      }

      .terminal-note {
        display: flex;
        align-items: center;
        gap: 13px;
        width: min(100%, 420px);
        margin: 0 auto;
        padding: 15px 18px;
        border: 1px solid #e9e3dd;
        border-radius: 18px;
        background: rgba(255, 255, 252, 0.78);
        color: #635d58;
        text-align: left;
      }

      .terminal-mark {
        display: grid;
        width: 35px;
        height: 35px;
        flex: 0 0 35px;
        place-items: center;
        border-radius: 12px;
        background: #f5eae4;
        color: #805e51;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .terminal-copy {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .terminal-copy strong {
        display: block;
        margin-bottom: 1px;
        color: #514941;
        font-size: 0.9rem;
        font-weight: 650;
      }

      @media (max-width: 480px) {
        main {
          padding: 34px 20px;
        }

        .mascot {
          margin-bottom: 23px;
        }

        .message {
          margin-bottom: 25px;
        }

        .terminal-note {
          padding: 14px 15px;
        }
      }

    </style>
  </head>
  <body>
    <main>
