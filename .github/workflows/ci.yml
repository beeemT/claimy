name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag to rebuild and publish"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read

jobs:
  checks:
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.6.0
          persist_github_token: false

      - name: Run repository checks
        run: mise run check

      - name: Build application image
        run: docker build --pull --tag claimy:ci .

      - name: Exercise the application image against disposable MySQL
        env:
          CLAIMY_IMAGE: claimy:ci
        run: mise exec -- go test -count=1 -tags=integration,fixtures ./test/e2e

      - name: Expose tested source SHA
        id: source
        run: printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  packages:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: checks
    outputs:
      source_sha: ${{ needs.checks.outputs.source_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify package source
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::stable package requires vMAJOR.MINOR.PATCH"; exit 1; }
            git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || { echo "::error::tag does not exist"; exit 1; }
            tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            [[ "$tag_sha" == "$SOURCE_SHA" ]] || { echo "::error::tested SHA is not the requested tag commit"; exit 1; }
            git merge-base --is-ancestor "$tag_sha" "origin/$DEFAULT_BRANCH" || { echo "::error::tag is not contained in the default branch"; exit 1; }
            version="${RELEASE_TAG#v}"
          else
            version=0.0.0
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install repository tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.6.0
          persist_github_token: false

      - name: Build archives and formula
        run: mise run package-local "${{ steps.version.outputs.version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimy-package
          path: dist/

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: packages
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check release secret before publication
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required before publication"
            exit 1
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimy-package
          path: dist

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SOURCE_SHA: ${{ needs.packages.outputs.source_sha }}
        run: |
          current_sha="$(gh api "repos/$GH_REPO/commits/$VERSION" --jq .sha)"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::release tag changed after the tested package build"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes
          fi

      - name: Update personal Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$TAP_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone "https://github.com/beeemT/homebrew-tap.git" tap
          cp "dist/claimy.rb" tap/Formula/claimy.rb
          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C tap add Formula/claimy.rb
          if git -C tap diff --cached --quiet; then
            exit 0
          fi
          git -C tap commit -m 'claimy '"$VERSION"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -C tap push

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit SHA and validate release tag
        id: commit
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && ! "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' is not a valid Docker image tag; refusing to publish a rewritten alias."
            exit 1
          fi

          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'beeemt' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/beeemt/claimy
          flavor: latest=true
          tags: |
            type=raw,value=${{ steps.commit.outputs.sha }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
